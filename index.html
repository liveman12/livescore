<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Livescore</title>
<style>body{font-family:sans-serif;background:#0f1115;color:#fff;margin:0;padding:12px}select,input,button{padding:11px;border-radius:10px;border:0;background:#1e222b;color:#fff;margin:4px 0}button{background:#00c853;color:#000;font-weight:700}.tabs{display:flex;gap:8px;margin:14px 0}.tab{padding:10px 14px;background:#222;border-radius:20px;cursor:pointer}.tab.active{background:#00c853;color:#000;font-weight:700}.card{background:#1a1e27;padding:13px;border-radius:14px;margin:10px 0;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{padding:8px;text-align:left;border-bottom:1px solid #333}.box{background:#1a1e27;padding:12px;border-radius:12px;margin:10px 0}.badge{background:#00c853;color:#000;padding:2px 8px;border-radius:10px;font-size:12px}</style></head><body>
<h2>⚽ Livescore - Highlightly</h2>
<div><input type="date" id="date"><select id="league"><option value="">All Leagues</option><option value="33973">Premier League</option><option value="140">La Liga</option><option value="135">Serie A</option><option value="78">Bundesliga</option><option value="61">Ligue 1</option><option value="2">Champions League</option></select><button onclick="loadFixtures()">Load Matches</button></div>
<div class="tabs"><div class="tab active" id="t-live" onclick="show('live')">Live / Fixtures</div><div class="tab" id="t-table" onclick="show('table')">Table</div><div class="tab" id="t-detail" onclick="show('detail')">Lineup / Detail</div></div>
<div id="content">Loading...</div>
<script>
let matches=[], selected=null, currentTab='live';
document.getElementById('date').value='2026-11-25';
function show(t){currentTab=t;document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));document.getElementById('t-'+t).classList.add('active');if(t==='live')render();if(t==='table')loadTable();if(t==='detail')loadDetail();}
function fmtScore(m){
  let sc=m.state?.score;
  if(sc && typeof sc==='object'){
    if(sc.current!=null) return sc.current;
    if(sc.fullTime!=null) return sc.fullTime;
    let h=sc.home??sc.homeTeam??0, a=sc.away??sc.awayTeam??0;
    return h+' - '+a;
  }
  if(sc) return String(sc);
  return '0 - 0';
}
function getTime(m){let d=m.date||m.startTime||''; if(!d) return ''; try{return new Date(d).toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}catch(e){return d;}}
async function loadFixtures(){
  const d=document.getElementById('date').value||'2026-11-25';
  document.getElementById('content').innerHTML='Loading...';
  try{
    const r=await fetch(`/api?type=fixtures&date=${d}`);
    const j=await r.json();
    // Highlightly returns ARRAY directly, not j.data
    if(Array.isArray(j)) matches=j;
    else matches=j.data||j.matches||j.response||[];
    render();
  }catch(e){document.getElementById('content').innerHTML='Error: '+e.message;}
}
function render(){
  if(!matches.length) return document.getElementById('content').innerHTML='No matches. Try another date.';
  document.getElementById('content').innerHTML=matches.slice(0,100).map((m,i)=>{
    const h=m.homeTeam?.name||'Home'; const a=m.awayTeam?.name||'Away';
    const st=m.state?.description||'Scheduled';
    const lg=m.league?.name||'';
    return `<div class="card" onclick="selectMatch(${i})"><div style="display:flex;justify-content:space-between"><span>${lg}</span><span class="badge">${st}</span></div><div style="margin:8px 0;font-size:17px"><b>${h}</b> <span style="color:#00c853">${fmtScore(m)}</span> <b>${a}</b></div><small>${getTime(m)} • Tap for Detail</small></div>`;
  }).join('');
}
function selectMatch(i){selected=matches[i];show('detail');}
async function loadTable(){
  const lg=document.getElementById('league').value;
  if(!lg) return document.getElementById('content').innerHTML='<div class="box">Select a league for top, then tap Table again.</div>';
  document.getElementById('content').innerHTML='Loading table...';
  const r=await fetch(`/api?type=standings&league=${lg}`); const j=await r.json();
  document.getElementById('content').innerHTML='<div class="box"><pre style="white-space:pre-wrap;font-size:11px">'+JSON.stringify(j,null,2).slice(0,4000)+'</pre></div><p>Send me this screenshot, I go format table.</p>';
}
async function loadDetail(){
  if(!selected) return document.getElementById('content').innerHTML='Go Live tab, tap a match first.';
  const id=selected.id; document.getElementById('content').innerHTML='Loading detail...';
  const r=await fetch(`/api?type=detail&fixture=${id}`); const j=await r.json();
  const d=Array.isArray(j)?j[0]: (j.data||j);
  document.getElementById('content').innerHTML=`<div class="box"><h3>${selected.homeTeam?.name} ${fmtScore(selected)} ${selected.awayTeam?.name}</h3><p>${selected.state?.description||''} • ${getTime(selected)}</p></div><div class="box"><h3>Lineup / Events / H2H (raw)</h3><pre style="white-space:pre-wrap;font-size:11px">${JSON.stringify(d,null,2).slice(0,6000)}</pre></div><p>Send me screenshot of this, I go make am fine lineup.</p>`;
}
loadFixtures();
</script></body></html>
