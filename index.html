<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Livescore</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0f1115;color:#fff;margin:0;padding:12px}
h2{margin:6px 0 10px}
select,input,button{padding:11px;border-radius:10px;border:0;background:#1e222b;color:#fff;margin:4px 0;font-size:15px}
button{background:#00c853;color:#000;font-weight:700}
.tabs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.tab{padding:10px 14px;background:#222;border-radius:20px;cursor:pointer}
.tab.active{background:#00c853;color:#000;font-weight:700}
.card{background:#1a1e27;padding:13px;border-radius:14px;margin:10px 0;cursor:pointer}
.card small{color:#aaa}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;text-align:left;border-bottom:1px solid #333;font-size:14px}
.box{background:#1a1e27;padding:12px;border-radius:12px;margin:10px 0}
.badge{background:#00c853;color:#000;padding:2px 8px;border-radius:10px;font-size:12px}
.badge.live{background:#ff3b30;color:#fff}
.lineup{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>
<body>
<h2>⚽ Livescore - Highlightly</h2>

<div>
<input type="date" id="date">
<select id="league">
<option value="">All Leagues</option>
<option value="33973">Premier League</option>
<option value="140">La Liga</option>
<option value="135">Serie A</option>
<option value="78">Bundesliga</option>
<option value="61">Ligue 1</option>
<option value="2">Champions League</option>
</select>
<button onclick="loadFixtures()">Load Matches</button>
</div>

<div class="tabs">
<div class="tab active" id="t-live" onclick="show('live')">Live / Fixtures</div>
<div class="tab" id="t-table" onclick="show('table')">Table</div>
<div class="tab" id="t-detail" onclick="show('detail')">Lineup / Detail</div>
</div>

<div id="content">Loading...</div>

<script>
let matches=[], selected=null, currentTab='live';
document.getElementById('date').value=new Date().toISOString().slice(0,10);

function show(t){
  currentTab=t;
  document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));
  document.getElementById('t-'+t).classList.add('active');

  if(t==='table') loadTable();
  if(t==='detail') loadDetail();
}
